name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install JS dependencies
      run: npm ci

    - name: Build Web App
      run: npm run build

    - name: Verify Capacitor Config
      run: npx cap sync ios
      
    # Note: To fully build the iOS app, you would need Apple Certificates and Provisioning Profiles 
    # configured in your GitHub Secrets (e.g., using fastlane or xcodebuild actions).
    # This step just verifies the web build and iOS sync succeed.
    - name: Build iOS Workspace (Simulator)
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' build
